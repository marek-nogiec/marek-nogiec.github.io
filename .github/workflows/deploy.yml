name: Verify and optionally deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified artifact to GitHub Pages
        required: true
        default: false
        type: boolean

concurrency:
  group: homepage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: install
        name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium headless shell
        run: npm exec -- playwright install --with-deps --only-shell chromium
      - id: commitlint
        name: Conventional commit messages
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -n "$COMMITLINT_FROM" ]; then
            npm exec -- commitlint --from "$COMMITLINT_FROM" --to "$COMMITLINT_TO" --verbose
            printf '%s\n' "$PULL_REQUEST_TITLE" | npm exec -- commitlint --verbose
          else
            npm exec -- commitlint --last --verbose
          fi
      - id: verify
        name: Build, static checks, size budgets, and unit tests
        run: npm run verify
      - id: browser
        name: Cross-viewport browser verification
        run: npm run verify:browser:built
      - id: lighthouse
        name: Lighthouse budgets
        run: npm run verify:lighthouse:built
      - id: report
        name: Publish run summary
        if: always()
        run: |
          node scripts/ci-report.mjs --output ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
          delimiter="CI_REPORT_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'report<<%s\n' "$delimiter"
            cat ci-report.md
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMMITLINT_OUTCOME: ${{ steps.commitlint.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package Pages artifact
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.deploy
          && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  report:
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.verify.outputs.report != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Update pull request report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_BODY: ${{ needs.verify.outputs.report }}
        with:
          script: |
            const marker = "<!-- homepage-ci-report -->";
            const body = process.env.REPORT_BODY;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.deploy
      && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
